# One Argo CD Application per environment, each syncing its overlay into its own namespace.
# The root Application (created by Terraform in calculator-ci-test) points at this folder.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: calculator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: calculator-{{.env}}
      # Deleting the Application also deletes its resources (and the ALB behind the Ingress)
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/yashago/calculator-gitops.git
        targetRevision: main
        path: overlays/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: calculator-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
