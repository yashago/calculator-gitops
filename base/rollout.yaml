# Argo Rollouts replaces a Deployment: same pod template, plus a canary strategy
# with ALB weighted traffic and Prometheus analysis between steps.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: calculator
spec:
  # No replicas field: the HPA owns the count. Setting it here would make Argo CD's
  # self-heal fight the autoscaler.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: calculator
      containers:
        - name: calculator
          image: calculator # kustomize replaces this with the ECR image and tag
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi # no CPU limit: avoids throttling the JVM at startup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe: # JVM startup is slow on 100m CPU; liveness waits for this
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: tmp # Tomcat needs a writable temp dir; the rest of the filesystem is read-only
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      stableService: calculator-stable
      canaryService: calculator-canary
      trafficRouting:
        alb:
          ingress: calculator
          servicePort: 80
      analysis:
        # Runs for the whole rollout; any failed measurement aborts and shifts traffic back to stable
        templates:
          - templateName: calculator-canary-health
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
