apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: calculator-dev

resources:
- ../../base

# CI (calculator-ci-test, update-gitops job) rewrites this after every publish to main
images:
- name: calculator
  newName: 337224145785.dkr.ecr.il-central-1.amazonaws.com/calculator
  newTag: sha-a69e576

# Same image in every environment; only configuration differs
patches:
- target:
    kind: Rollout
    name: calculator
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: APP_ENV
          value: dev
