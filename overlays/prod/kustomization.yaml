apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: calculator-prod

resources:
  - ../../base

# Changed only through a reviewed PR that promotes the tag currently running in dev
images:
  - name: calculator
    newName: 337224145785.dkr.ecr.il-central-1.amazonaws.com/calculator
    newTag: sha-068ba5b

# Same image in every environment; only configuration differs
patches:
  - target:
      kind: Rollout
      name: calculator
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: prod
  - target:
      kind: HorizontalPodAutoscaler
      name: calculator
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
