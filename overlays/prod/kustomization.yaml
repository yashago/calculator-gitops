apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: calculator-prod

resources:
  - ../../base

# Changed only through a reviewed PR that promotes the tag currently running in dev
images:
  - name: calculator
    newName: 337224145785.dkr.ecr.il-central-1.amazonaws.com/calculator
    newTag: sha-3b4f61f

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: calculator
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
